<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background Rounded Square -->
  <rect width="100" height="100" rx="22" fill="#09090b"/>
  <!-- Cross Grid Lines -->
  <line x1="50" y1="12" x2="50" y2="88" stroke="#27272a" stroke-width="4" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="88" y2="50" stroke="#27272a" stroke-width="4" stroke-linecap="round"/>
  <!-- Letters -->
  <!-- E (Top Left) -->
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="central">E</text>
  <!-- B (Top Right) -->
  <text x="70" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#10b981" text-anchor="middle" dominant-baseline="central">B</text>
  <!-- S (Bottom Left) -->
  <text x="30" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="central">S</text>
  <!-- I (Bottom Right) -->
  <text x="70" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#10b981" text-anchor="middle" dominant-baseline="central">I</text>
</svg>
